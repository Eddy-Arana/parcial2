{% extends "base.html" %}

{% block title %}

{% if producto %}
    Editar producto
{% else %}
    Nuevo producto
{% endif %}

{% endblock %}


{% block contenido %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3 class="mb-0">

                    {% if producto %}
                        Editar producto
                    {% else %}
                        Nuevo producto
                    {% endif %}

                </h3>

            </div>


            <div class="card-body">

                <form method="POST">


                    <div class="mb-3">

                        <label
                            for="codigo"
                            class="form-label">
                            Código
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="codigo"
                            name="codigo"
                            value="{{ producto.codigo if producto else '' }}"
                            maxlength="30"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="nombre"
                            class="form-label">
                            Nombre del producto
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombre"
                            name="nombre"
                            value="{{ producto.nombre if producto else '' }}"
                            maxlength="120"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="categoria"
                            class="form-label">
                            Categoría
                        </label>

                        <select
                            class="form-select"
                            id="categoria"
                            name="categoria"
                            required>

                            <option value="">
                                Seleccione una categoría
                            </option>

                            <option
                                value="Computadoras"
                                {% if producto and producto.categoria == "Computadoras" %}selected{% endif %}>
                                Computadoras
                            </option>

                            <option
                                value="Accesorios"
                                {% if producto and producto.categoria == "Accesorios" %}selected{% endif %}>
                                Accesorios
                            </option>

                            <option
                                value="Monitores"
                                {% if producto and producto.categoria == "Monitores" %}selected{% endif %}>
                                Monitores
                            </option>

                            <option
                                value="Redes"
                                {% if producto and producto.categoria == "Redes" %}selected{% endif %}>
                                Redes
                            </option>

                        </select>

                    </div>


                    <div class="mb-3">

                        <label
                            for="precio"
                            class="form-label">
                            Precio
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="precio"
                            name="precio"
                            value="{{ producto.precio if producto else '' }}"
                            step="0.01"
                            min="0"
                            required>

                    </div>


                    <div class="mb-3">

                        <label
                            for="existencia"
                            class="form-label">
                            Existencia
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="existencia"
                            name="existencia"
                            value="{{ producto.existencia if producto else '' }}"
                            min="0"
                            required>

                    </div>


                    <div class="form-check mb-3">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="activo"
                            name="activo"
                            {% if not producto or producto.activo %}checked{% endif %}>

                        <label
                            class="form-check-label"
                            for="activo">
                            Producto activo
                        </label>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-success">

                            {% if producto %}
                                Actualizar producto
                            {% else %}
                                Guardar producto
                            {% endif %}

                        </button>


                        <a
                            href="{{ url_for('productos') }}"
                            class="btn btn-secondary">
                            Cancelar
                        </a>

                    </div>


                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
